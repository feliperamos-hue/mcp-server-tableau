name: Deploy to ECR

on:
  push:
    branches: [main]

permissions:
  id-token: write   # REQUIRED for OIDC
  contents: read
  pull-requests: write

env:
  REPOSITORY: cross/ai-platform/mcp-server-tableau
  ECR_REGISTRY: ${{ secrets.AWS_CROSS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push-to-ecr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: echo "image_tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (linux/arm64)
        run: |
          docker buildx build --platform linux/arm64 \
            -t ${{ env.ECR_REGISTRY }}/${{ env.REPOSITORY }}:${{ steps.image.outputs.image_tag }} \
            -t ${{ env.ECR_REGISTRY }}/${{ env.REPOSITORY }}:latest \
            --load .

      - name: Push image to AWS ECR
        uses: olxbr/aws-ecr-push-action@v1
        id: ecr
        with:
          ecr_repository: ${{ env.REPOSITORY }}
          tags: ${{ steps.image.outputs.image_tag }},latest
          keep_images: 10
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_CROSS_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_CROSS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_CROSS_SECRET_ACCESS_KEY }}
          AWS_PRINCIPAL_RULES: ${{ secrets.AWS_PRINCIPAL_RULES }}

      - name: Output deployment info
        run: |
          echo "🚀 Successfully deployed to ECR:"
          echo "Repository: ${{ steps.ecr.outputs.repository_uri }}"

    outputs:
      image: ${{ env.REPOSITORY }}:${{ steps.image.outputs.image_tag }}
      image_tag: ${{ steps.image.outputs.image_tag }}